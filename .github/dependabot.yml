version: 2

updates:
  # Keeps the commit-SHA pins in .github/workflows current. Without this they
  # are pinned and then quietly go stale, which is worse than a moving tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "security(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR for the routine bumps; majors still come in on their own so
      # they get read properly.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
